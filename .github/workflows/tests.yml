# F1: run the backend test suite (tenant isolation included) on every push.
# Needs no secrets: Qdrant, Supabase and the LLM are replaced by in-memory
# fakes or patched in the tests, and tests/conftest.py sets a test-only
# AUTH_SECRET.
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      # CPU-only torch wheels (the default ones bundle ~2 GB of CUDA).
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # matches the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
