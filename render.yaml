# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this file, then in Render choose "New +" → "Blueprint" and
# point it at this repository.
#
# Secrets are marked `sync: false`, so Render prompts for them on first deploy
# instead of keeping them in git.
services:
  - type: web
    name: matz-api
    runtime: python
    plan: free
    region: oregon

    # Installs, then downloads the embedding model (ONNX) into the project
    # folder so the service starts without fetching it.
    buildCommand: >-
      pip install -r requirements.txt &&
      python -c "from agents.langgraph_agent.embeddings.embeddings import download_model; download_model()"
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT --no-server-header

    healthCheckPath: /health

    envVars:
      # Must match the Python the code is written against (3.13 locally).
      - key: PYTHON_VERSION
        value: "3.13.0"

      # Model cache inside the project, so files downloaded during the
      # build are still there at runtime. No PyTorch: the model runs on
      # onnxruntime, which keeps the API under the free plan's 512 MB.
      - key: HF_HOME
        value: /opt/render/project/src/.hf-cache

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # First admin account, created on startup if it does not exist (A3).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Optional — enables vision transcription of scanned PDF pages.
      # Without it, scanned pages are reported as unreadable rather than
      # silently dropped, and everything else still works.
      - key: FIREWORKS_API_KEY
        sync: false
