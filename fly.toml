# fly.toml app configuration file generated for matz-api on 2026-11-04T10:32:18+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'matz-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "10s"
  grace_period = "90s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
